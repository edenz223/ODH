name: Pre-release extension

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional X.Y.Z version; defaults to the current version with patch +1'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pre-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Prepare pre-release version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = require('./src/manifest.json');
          const packageVersion = require('./package.json').version;
          if (packageVersion !== version) {
            console.error(`Manifest (${version}) and package (${packageVersion}) versions must match.`);
            process.exit(1);
          }
          const [major, minor, patch] = version.split('.').map(Number);
          const releaseVersion = process.env.REQUESTED_VERSION.trim() || `${major}.${minor}.${patch + 1}`;
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(releaseVersion) ||
              releaseVersion.split('.').some(part => Number(part) > 65535) ||
              releaseVersion === '0.0.0') {
            console.error('Pre-release version must be X.Y.Z, with each component between 0 and 65535, and must not be 0.0.0.');
            process.exit(1);
          }
          const tag = `v${releaseVersion}-pre.${process.env.GITHUB_RUN_ID}.${process.env.GITHUB_RUN_ATTEMPT}`;
          fs.appendFileSync(process.env.GITHUB_ENV, `PRE_RELEASE_VERSION=${releaseVersion}\nRELEASE_TAG=${tag}\n`);
          NODE

      - name: Install dependencies
        run: |
          npm install --global npm@11.19.0
          npm ci

      - name: Lint and test
        run: |
          npm run lint
          npm run test:contracts
          npm run test:unit

      - name: Package extension
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const manifestPath = './src/manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.version = process.env.PRE_RELEASE_VERSION;
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 4)}\n`);
          NODE
          mkdir -p dist
          cd src
          zip -r "../dist/odh-${RELEASE_TAG}.zip" . -x 'bg/data/*' '.DS_Store' '*/.DS_Store'
          cd ../dist
          sha256sum "odh-${RELEASE_TAG}.zip" > SHA256SUMS
          unzip -t "odh-${RELEASE_TAG}.zip"

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" "dist/odh-${RELEASE_TAG}.zip" dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "ODH ${RELEASE_TAG}" \
            --prerelease --latest=false --generate-notes
